<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Forvaltningsrett: Oppdrag Eksamen</title>
<meta name="description" content="Puggespill i forvaltningsrett basert på Eckhoff/Smith. Skyt deg gjennom 33 kapitler.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1020'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23ffd166' font-family='Georgia'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Lås-skjerm -->
  <section id="screen-lock" class="screen active">
    <div class="lock-card">
      <div class="logo">§</div>
      <h1>Forvaltningsrett<br><span>Oppdrag Eksamen</span></h1>
      <p class="muted">33 kapitler. Ett våpen om gangen. Kan du Eckhoff?</p>
      <form id="lock-form" autocomplete="off">
        <label for="pw">Passord</label>
        <div class="pw-row">
          <input id="pw" type="password" placeholder="Skriv passordet" autocapitalize="off" spellcheck="false">
          <button type="button" id="pw-toggle" class="icon-btn" aria-label="Vis passord">👁</button>
        </div>
        <label class="check"><input type="checkbox" id="remember" checked> Husk meg på denne enheten</label>
        <button type="submit" class="btn primary big" id="unlock-btn">Lås opp og spill</button>
        <div id="lock-msg" class="msg" role="alert"></div>
      </form>
    </div>
  </section>

  <!-- Hovedmeny / kart -->
  <section id="screen-map" class="screen">
    <header class="topbar">
      <div class="brand">§ Oppdrag Eksamen</div>
      <div class="stats">
        <span title="Totalt poeng">⭐ <b id="total-score">0</b></span>
        <span title="Stjerner">🏅 <b id="total-stars">0</b>/<span id="max-stars">99</span></span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="btn-sound" title="Lyd av/på">🔊</button>
        <button class="icon-btn" id="btn-settings" title="Innstillinger">⚙️</button>
        <button class="icon-btn" id="btn-lock" title="Lås">🔒</button>
      </div>
    </header>

    <div class="map-wrap">
      <div class="mode-row">
        <button class="btn mode" id="btn-training">🎯 Treningsleir<small>Repeter det du bommet på</small></button>
        <button class="btn mode" id="btn-exam">🎓 Eksamensmodus<small>30 spørsmål fra alle åpne kapitler</small></button>
      </div>
      <div id="worlds"></div>
    </div>
  </section>

  <!-- Spill -->
  <section id="screen-game" class="screen">
    <div class="hud">
      <div class="hud-left">
        <button class="icon-btn" id="btn-quit" title="Tilbake til kartet">←</button>
        <div class="level-name"><small id="hud-level">Level 1</small><b id="hud-title">Kapittel</b></div>
      </div>
      <div class="hud-mid">
        <div class="progress"><div id="hud-progress" class="bar"></div><div class="boss-flag">👑</div></div>
      </div>
      <div class="hud-right">
        <div class="hearts" id="hud-hearts"></div>
        <div class="score">⭐ <b id="hud-score">0</b></div>
        <div class="streak" id="hud-streak"></div>
      </div>
    </div>

    <div class="arena">
      <canvas id="game" width="960" height="420"></canvas>
      <div id="weapon-badge" class="weapon-badge"></div>
      <div id="timer" class="timer"><div id="timer-bar"></div></div>
    </div>

    <div class="qpanel" id="qpanel">
      <div class="qtext" id="qtext">Gjør deg klar…</div>
      <div class="answers" id="answers"></div>
    </div>

    <div id="feedback" class="feedback hidden">
      <div class="fb-card">
        <div class="fb-head" id="fb-head">Riktig!</div>
        <div class="fb-body" id="fb-body"></div>
        <blockquote class="fb-source" id="fb-source"></blockquote>
        <button class="btn primary" id="fb-next">Fortsett ➜</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden"></div>
  </section>

  <!-- Innstillinger -->
  <div id="settings" class="modal hidden">
    <div class="modal-card">
      <h2>Innstillinger</h2>
      <label class="check"><input type="checkbox" id="set-sound" checked> Lydeffekter</label>
      <label class="check"><input type="checkbox" id="set-music" checked> Musikk</label>
      <label class="check"><input type="checkbox" id="set-timer" checked> Tidspress (fienden nærmer seg)</label>
      <label class="check"><input type="checkbox" id="set-shake"> Skjermristing</label>
      <label class="check"><input type="checkbox" id="set-auto" checked> Gå videre automatisk etter riktig svar</label>
      <div class="row">
        <button class="btn danger" id="btn-reset">Slett all fremgang</button>
        <button class="btn primary" id="btn-settings-close">Lukk</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="data/questions.enc.js"></script>
<script src="js/crypto.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
